# Setup and CI select the exact packageManager pin.
# Keep one lockfile document for GitHub dependency detection.
pmOnFail: ignore
engineStrict: true
nodeVersion: 24.14.1
saveExact: true
verifyDepsBeforeRun: error
allowBuilds:
  nx: true
  less: false
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  unrs-resolver: false
