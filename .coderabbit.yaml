# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# cspell:words coderabbitai docstrings codecov
#
# CodeRabbit review policy for this repository. Keys left out here fall through to the
# organization settings because `inheritance` is on; without it this file would replace them.
inheritance: true
language: en-US
# Kept from the file this one replaces.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false

  auto_review:
    # The reviewer ladder requests CodeRabbit with a marked `@coderabbitai review` comment when it
    # picks it. A PR nobody requested gets no CodeRabbit review.
    enabled: false
    # Defer review until ready so unfinished changes do not consume the author's allowance.
    drafts: false
    # Every run counts against the PR author's review allowance, and a run on each push used it up
    # on 69% of PRs. Review once; `@coderabbitai review` re-runs on demand.
    auto_incremental_review: false

  # The walkthrough is a status container the PR loop has to read on every edit. Keep the review
  # status (skip and limit notices end the loop's wait) and drop everything that restates the diff.
  high_level_summary: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  review_status: true

  pre_merge_checks:
    # AGENTS.md describes where comments add context. A percentage cannot measure that.
    docstrings:
      mode: 'off'
    # Work is tracked in ClickUp: 0 of the last 100 merged PRs here closed a GitHub issue.
    issue_assessment:
      mode: 'off'

  finishing_touches:
    docstrings:
      enabled: false

  # Review authored agent guidance and keep generated rule outputs out of the diff review.
  path_filters:
    - '!.claude/skills/**'
    - '!apps/methodologies/bold-carbon/rule-processors/*/*/README.md'
    - '!apps/methodologies/bold-recycling/rule-processors/*/*/README.md'
    - '!libs/methodologies/*/rules/README.md'
    - '!codecov.yml'

  path_instructions:
    - path: '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
      instructions: >-
        Follow the review guidelines in AGENTS.md. Preserve comments that explain a reason,
        an invariant or an external constraint.

chat:
  # Replies on review threads are where CodeRabbit records learnings from declined findings.
  auto_reply: true
