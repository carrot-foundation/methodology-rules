# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# cspell:words coderabbitai docstrings codecov
#
# CodeRabbit review policy for this repository. Keys left out here fall through to the
# organization settings because `inheritance` is on; without it this file would replace them.
inheritance: true
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false

  auto_review:
    enabled: true
    # Incremental review is off, so this is the one review a PR gets. Taking it when the PR opens,
    # draft included, lands its findings before E2E and promotion; waiting for ready would add a
    # second round after promotion that re-runs E2E.
    drafts: true
    # Every run counts against the PR author's review allowance, and a run on each push used it up
    # on 69% of PRs. Review once; `@coderabbitai review` re-runs on demand.
    auto_incremental_review: false

  # The walkthrough is a status container the PR loop has to read on every edit. Keep the review
  # status (skip and limit notices end the loop's wait) and drop everything that restates the diff.
  high_level_summary: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  review_status: true

  pre_merge_checks:
    # The coverage target contradicts .ai/rules/code-comments.md; the PR loop declined every warning
    # it raised across the org.
    docstrings:
      mode: 'off'
    # Work is tracked in ClickUp, so there are no linked GitHub issues to assess.
    issue_assessment:
      mode: 'off'

  finishing_touches:
    docstrings:
      enabled: false

  # Outputs of `pnpm ai:sync` (`pnpm ai:check` fails CI on drift), and the per-rule READMEs and
  # codecov.yml that scripts/generate-rule-readmes.ts renders from rules.config.ts
  # (.ai/rules/canonical-config.md).
  # AGENTS.md, CLAUDE.md and .cursor/rules are generated too, but CodeRabbit reads them as coding
  # guidelines and path filters also narrow its checkout, so they are handled by path_instructions.
  path_filters:
    - '!.agents/skills/**'
    - '!.claude/skills/**'
    - '!.claude/agents/**'
    - '!.cursor/skills/**'
    - '!.cursor/agents/**'
    - '!.ai/PARITY_MATRIX.md'
    - '!apps/methodologies/*/rule-processors/**/README.md'
    - '!codecov.yml'

  path_instructions:
    - path: AGENTS.md
      instructions: &generated-adapter >-
        Generated by `pnpm ai:sync` from `.ai/`. Do not comment on this file; raise any finding
        against the `.ai/` source it was rendered from.
    - path: CLAUDE.md
      instructions: *generated-adapter
    - path: '.cursor/rules/**'
      instructions: *generated-adapter
    - path: '**/*.{ts,tsx,js,jsx,mjs,cjs}'
      instructions: >-
        Judge comments and docstrings against `.ai/rules/code-comments.md`, not a coverage target.
        Do not ask to add docstrings, or to shorten or delete a comment that states a reason, an
        invariant or an external constraint.

chat:
  # Replies on review threads are where CodeRabbit records learnings from declined findings.
  auto_reply: true
