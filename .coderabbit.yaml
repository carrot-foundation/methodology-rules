# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# cspell:words coderabbitai docstrings codecov
#
# CodeRabbit review policy for this repository. Keys left out here fall through to the
# organization settings because `inheritance` is on; without it this file would replace them.
inheritance: true
language: en-US
# Kept from the file this one replaces.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false

  auto_review:
    enabled: true
    # Incremental review is off, so this is the one review a PR gets. Taking it when the PR opens,
    # draft included, lands its findings while the PR is still a draft instead of in a second round
    # after it is marked ready.
    drafts: true
    # Every run counts against the PR author's review allowance, and a run on each push used it up
    # on 69% of PRs. Review once; `@coderabbitai review` re-runs on demand.
    auto_incremental_review: false

  # The walkthrough is a status container the PR loop has to read on every edit. Keep the review
  # status (skip and limit notices end the loop's wait) and drop everything that restates the diff.
  high_level_summary: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  review_status: true

  pre_merge_checks:
    # .ai/rules/code-comments.md decides where docstrings belong, not a coverage percentage; the PR
    # loop declined every warning this check raised across the org.
    docstrings:
      mode: 'off'
    # Work is tracked in ClickUp: 0 of the last 100 merged PRs here closed a GitHub issue.
    issue_assessment:
      mode: 'off'

  finishing_touches:
    docstrings:
      enabled: false

  # Rewritten by every `pnpm ai:sync` from `.ai/`, and the READMEs and codecov.yml the rule registry
  # generates (.ai/rules/canonical-config.md). The READMEs under apps/methodologies/bold/ are
  # hand-maintained and stay in review. AGENTS.md, CLAUDE.md and .cursor/rules are generated too,
  # but CodeRabbit reads them as coding guidelines and path filters also narrow its checkout, so
  # they are handled by path_instructions.
  path_filters:
    - '!.agents/skills/**'
    - '!.claude/skills/**'
    - '!.claude/agents/**'
    - '!.claude/settings.json'
    - '!.cursor/skills/**'
    - '!.cursor/agents/**'
    - '!.ai/PARITY_MATRIX.md'
    - '!apps/methodologies/bold-carbon/rule-processors/*/*/README.md'
    - '!apps/methodologies/bold-recycling/rule-processors/*/*/README.md'
    - '!libs/methodologies/*/rules/README.md'
    - '!codecov.yml'

  path_instructions:
    - path: AGENTS.md
      instructions: &generated-adapter >-
        Generated by `pnpm ai:sync` from `.ai/`. Do not comment on this file; raise any finding
        against the `.ai/` source it was rendered from.
    - path: CLAUDE.md
      instructions: *generated-adapter
    - path: '.cursor/rules/**'
      instructions: *generated-adapter
    - path: '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
      instructions: >-
        Ask for docstrings only where `.ai/rules/code-comments.md` requires them, never to meet a
        coverage target. Do not ask to shorten or delete a comment that states a reason, an
        invariant or an external constraint.

chat:
  # Replies on review threads are where CodeRabbit records learnings from declined findings.
  auto_reply: true
